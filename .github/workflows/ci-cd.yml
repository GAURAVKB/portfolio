name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  JAVA_IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio-api
  GO_IMAGE: ghcr.io/${{ github.repository_owner }}/go-metrics

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Test & Build Spring Boot → push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────
  build-java:
    name: Build & Push Spring Boot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: services/portfolio-api
        run: mvn -B test

      - name: Build JAR (skip tests, already ran)
        working-directory: services/portfolio-api
        run: mvn -B package -DskipTests

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Spring Boot image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: services/portfolio-api
          push: true
          tags: ${{ env.JAVA_IMAGE }}:latest,${{ env.JAVA_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Test & Build Go → push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────
  build-go:
    name: Build & Push Go Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/go-metrics/go.sum

      - name: Run Go tests
        working-directory: services/go-metrics
        run: go test ./...

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Go image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: services/go-metrics
          push: true
          tags: ${{ env.GO_IMAGE }}:latest,${{ env.GO_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy Angular to Vercel
  # ─────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Angular → Vercel
    runs-on: ubuntu-latest
    needs: [build-java, build-go]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration production
        env:
          NG_APP_API_URL: ${{ secrets.VITE_API_URL }}
          NG_APP_GO_URL: ${{ secrets.VITE_GO_URL }}

      - name: Deploy to Vercel
        working-directory: frontend
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Trigger Render deploys via deploy hooks
  # ─────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Services → Render
    runs-on: ubuntu-latest
    needs: [build-java, build-go]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Spring Boot deploy
        run: curl -s "${{ secrets.RENDER_JAVA_DEPLOY_HOOK }}"

      - name: Trigger Go service deploy
        run: curl -s "${{ secrets.RENDER_GO_DEPLOY_HOOK }}"
