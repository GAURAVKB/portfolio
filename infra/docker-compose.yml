version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  portfolio-api:
    build:
      context: ../services/portfolio-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/portfolio
      DB_USERNAME: portfolio
      DB_PASSWORD: portfolio_dev
      JWT_SECRET: dev-secret-change-in-production-min-256-bits
      MAIL_HOST: smtp.resend.com
      MAIL_PORT: 587
      MAIL_USERNAME: resend
      MAIL_PASSWORD: ${RESEND_API_KEY}
      MAIL_FROM: noreply@yourdomain.com
      ADMIN_EMAIL: you@youremail.com
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  go-metrics:
    build:
      context: ../services/go-metrics
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      PORT: 9090
      GITHUB_USERNAME: your-github-username
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ALLOWED_ORIGIN: http://localhost:4200

volumes:
  pg_data:
