spring:
  application:
    name: portfolio-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio_dev}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-secret-at-least-256-bits-long-change-me-now}
    expiration-ms: 86400000  # 24 hours
  admin:
    password: ${ADMIN_PASSWORD:admin123}
  mail:
    from: ${MAIL_FROM:noreply@yourdomain.com}
    admin-email: ${ADMIN_EMAIL:you@email.com}
  github:
    token: ${GITHUB_TOKEN:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.portfolio: INFO
    org.springframework.security: WARN
